<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction - Malware Detection</title>
    <style>
        /* [your full CSS unchanged] */
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(to right, #2c3e50, #4a6984);
            color: white;
            text-align: center;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .nav {
            background-color: #34495e;
            padding: 1rem;
            text-align: center;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 1.5rem;
            font-size: 1.2rem;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .nav a:hover {
            color: #a3bffa;
            transform: scale(1.1);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .main-content {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1s ease-in-out;
        }
        .main-content h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        .main-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #555;
            text-align: center;
        }
        .sections-container {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .section {
            flex: 1;
            padding: 1.5rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .section h3 {
            color: #34495e;
            font-size: 1.6rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(to right, #2c3e50, #4a6984);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            text-align: center;
            transition: background 0.3s ease, transform 0.3s ease;
            margin: 1rem auto;
            display: block;
            width: fit-content;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: linear-gradient(to right, #34495e, #5a7a94);
            transform: translateY(-2px);
        }
        .footer {
            background: linear-gradient(to right, #2c3e50, #4a6984);
            color: white;
            text-align: center;
            padding: 1.5rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.2);
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .sections-container {
                flex-direction: column;
            }
            .section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav">
            <a href="{{ url_for('user_home')}}">Home</a>
            <a href="{{ url_for('prediction')}}">Prediction</a>
            <a href="{{ url_for('login')}}">Log - Out</a>
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <h1>Malware Prediction</h1>
            <p>Enter the following features to predict if a file is malicious using our AI-powered model.</p>

            {% if result %}
                <div style="text-align:center; margin-top: 2rem;">
                    <h2>Prediction: {{ result }}</h2>
                </div>
            {% endif %}

            <form method="POST">
                <div class="sections-container">
                    <div class="section">
                        <h3>File Characteristics</h3>
                        <div class="form-group">
                            <label for="feature1">Sections Max Entropy</label>
                            <input type="number" step="any" id="feature1" name="SectionsMaxEntropy" required>
                        </div>
                        <div class="form-group">
                            <label for="feature2">Subsystem</label>
                            <input type="number" id="feature2" name="Subsystem" required>
                        </div>
                        <div class="form-group">
                            <label for="feature3">Dll Characteristics</label>
                            <input type="number" id="feature3" name="DllCharacteristics" required>
                        </div>
                        <div class="form-group">
                            <label for="feature4">Major Subsystem Version</label>
                            <input type="number" id="feature4" name="MajorSubsystemVersion" required>
                        </div>
                        <div class="form-group">
                            <label for="feature5">Size of Optional Header</label>
                            <input type="number" id="feature5" name="SizeOfOptionalHeader" required>
                        </div>
                    </div>

                    <div class="section">
                        <h3>File Entropy</h3>
                        <div class="form-group">
                            <label for="feature6">Resources Min Entropy</label>
                            <input type="number" step="any" id="feature6" name="ResourcesMinEntropy" required>
                        </div>
                        <div class="form-group">
                            <label for="feature7">Sections Mean Entropy</label>
                            <input type="number" step="any" id="feature7" name="SectionsMeanEntropy" required>
                        </div>
                        <div class="form-group">
                            <label for="feature8">Resources Max Entropy</label>
                            <input type="number" step="any" id="feature8" name="ResourcesMaxEntropy" required>
                        </div>
                        <div class="form-group">
                            <label for="feature9">Characteristics</label>
                            <input type="number" id="feature9" name="Characteristics" required>
                        </div>
                        <div class="form-group">
                            <label for="feature10">Check Sum</label>
                            <input type="number" id="feature10" name="CheckSum" required>
                        </div>
                    </div>

                    <div class="section">
                        <h3>Structural Features</h3>
                        <div class="form-group">
                            <label for="feature11">Sections Number</label>
                            <input type="number" id="feature11" name="SectionsNb" required>
                        </div>
                        <div class="form-group">
                            <label for="feature12">Minor Linker Version</label>
                            <input type="number" id="feature12" name="MinorLinkerVersion" required>
                        </div>
                        <div class="form-group">
                            <label for="feature13">Export Number</label>
                            <input type="number" id="feature13" name="ExportNb" required>
                        </div>
                        <div class="form-group">
                            <label for="feature14">Version Information Size</label>
                            <input type="number" id="feature14" name="VersionInformationSize" required>
                        </div>
                        <div class="form-group">
                            <label for="feature15">Sections Min Entropy</label>
                            <input type="number" step="any" id="feature15" name="SectionsMinEntropy" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
