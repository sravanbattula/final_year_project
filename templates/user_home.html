<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home - Eye Anemia Diagnosis AI</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(to right, #2c3e50, #4a6984);
            color: white;
            text-align: center;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .nav {
            background-color: #34495e;
            padding: 1rem;
            text-align: center;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 1.5rem;
            font-size: 1.2rem;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .nav a:hover {
            color: #a3bffa;
            transform: scale(1.1);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }
        .main-content {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1s ease-in-out;
        }
        .main-content h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        .main-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #555;
        }
        .footer {
            background: linear-gradient(to right, #2c3e50, #4a6984);
            color: white;
            text-align: center;
            padding: 1.5rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.2);
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(to right, #2c3e50, #4a6984);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            text-align: center;
            transition: background 0.3s ease, transform 0.3s ease;
            margin: 0.5rem;
        }
        .btn:hover {
            background: linear-gradient(to right, #34495e, #5a7a94);
            transform: translateY(-2px);
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav">
            <a href="{{ url_for('user_home')}}">Home</a>
            <a href="{{ url_for('prediction')}}">Prediction</a>
            <a href="{{ url_for('login')}}">Log - Out</a>
        </div>
    </div>
    <div class="container">
        <div class="main-content">
            <h1>Welcome to Your Dashboard</h1>
            <p>Hello, User! This is your personalized dashboard for the Malware Detection.</p>
            <div>
                <a href="{{ url_for('prediction')}}" class="btn">Make a New Prediction</a>
            </div>
        </div>
    </div>
</body>
</html>
